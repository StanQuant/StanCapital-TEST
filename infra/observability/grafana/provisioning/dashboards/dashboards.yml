# Grafana dashboard 自動佈建（D6）：從 /var/lib/grafana/dashboards 載入 6 份 JSON
apiVersion: 1

providers:
  - name: Stance Capital
    orgId: 1
    folder: Stance Capital
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
